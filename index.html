<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Une petite surprise 💖</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#ffd6e8,#ffeef5,#fce4ff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:420px;
    background:white;
    border-radius:25px;
    padding:30px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h2{
    color:#ff4f8b;
}

button{
    margin:8px;
    padding:12px 20px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    background:#ff80ab;
    color:white;
    font-size:16px;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
    background:#ff4f8b;
}

.emoji{
    font-size:60px;
}

select{
    padding:10px;
    border-radius:10px;
    font-size:16px;
    margin-top:10px;
}
</style>

</head>
<body>

<div class="card">

<div id="contenu">

<div class="emoji">🌸💖🧸</div>

<h2>Bonsoir, comment vas-tu ?</h2>

<button onclick="pasBien()">😔 Pas très bien</button>

<button onclick="bien()">😊 Ça va bien</button>

</div>

</div>

<script>

function pasBien(){
document.getElementById("contenu").innerHTML=`
<div class="emoji">🩷</div>
<h2>Oh non...</h2>

<p>J'espère que ta journée va s'améliorer. Tu es une personne formidable et tu mérites plein de bonheur. 🌷✨</p>

<button onclick="questionSortir()">Continuer 💕</button>
`;
}

function bien(){
document.getElementById("contenu").innerHTML=`
<div class="emoji">🥰</div>
<h2>Ça fait plaisir !</h2>

<p>J'espère que cette bonne humeur continuera toute la journée ! 🌸</p>

<button onclick="questionSortir()">Continuer 💕</button>
`;
}

function questionSortir(){

document.getElementById("contenu").innerHTML=`

<div class="emoji">🌹</div>

<h2>Peux-tu sortir avec moi ? 💌</h2>

<button onclick="oui()">Ouiii 💖</button>

<button onclick="non()">Non, désolé 😅</button>

`;

}

function oui(){

choisirHeure();

}

function non(){

document.getElementById("contenu").innerHTML=`

<div class="emoji">😂💕</div>

<h2>Tu croyais vraiment que ce bouton allait marcher ? 😏</h2>

<p>Allez... je vais faire comme si tu avais répondu OUI. 💖</p>

<button onclick="choisirHeure()">Continuer 🌸</button>

`;

}

function choisirHeure(){

document.getElementById("contenu").innerHTML=`

<div class="emoji">⏰✨</div>

<h2>À quelle heure ?</h2>

<select id="heure">

<option>09h00</option>

<option>16h00</option>

<option>18h00</option>

<option>20h00</option>

</select>

<br><br>

<button onclick="choisirRepas()">Suivant 🍽️</button>

`;

}

function choisirRepas(){

document.getElementById("contenu").innerHTML=`

<div class="emoji">🍕🌮🍝</div>

<h2>Qu'est-ce que tu préfères ?</h2>

<select>

<option>🍕 Pizza</option>

<option>🍝 Pâtes italiennes</option>

<option>🍕 Lasagnes</option>

<option>🌮 Tacos</option>

<option>🌯 Burrito</option>

<option>🥙 Quesadilla</option>

</select>

<br><br>

<button onclick="restaurant()">Continuer 💕</button>

`;

}

function restaurant(){

document.getElementById("contenu").innerHTML=`

<div class="emoji">🍽️✨</div>

<h2>Choisis le restaurant 💖</h2>

<select>

<option>Le Jules Verne 🇫🇷</option>

<option>Il Carpaccio 🇮🇹</option>

<option>Rosa Mexicano 🇲🇽</option>

</select>

<br><br>

<button onclick="fin()">Valider 💕</button>

`;

}

function fin(){

document.getElementById("contenu").innerHTML=`

<div class="emoji">💖🎉🌹</div>

<h2>Parfait !!</h2>

<p>Notre rendez-vous est confirmé ! 🥰✨</p>

<p>J'ai hâte de passer ce moment avec toi. 🌸💕</p>

`;

}

</script>

</body>
</html>
